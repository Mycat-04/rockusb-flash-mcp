name: Test and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag does not match package.json" }
      - run: npm ci --ignore-scripts
      - run: npm run build:windows
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Get-Item "dist/*-windows-x64.zip"
          $expected = (Get-Content "$($zip.FullName).sha256" -Raw).Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 $zip.FullName).Hash -ne $expected) { throw "Invalid ZIP checksum" }
          gh release create $env:GITHUB_REF_NAME $zip.FullName "$($zip.FullName).sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --latest --title "RockUSB Flash MCP $env:GITHUB_REF_NAME" --generate-notes --notes "Windows x64: download the ZIP, extract it, and run Install-RockUSB.cmd. The bilingual README covers setup for Codex and Claude Code."
